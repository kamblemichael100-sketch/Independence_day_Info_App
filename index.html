<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Independence Day 1947</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 15px;
            background: radial-gradient(circle at 20% 30%, rgba(255,153,51,0.15), transparent 40%),
                        radial-gradient(circle at 80% 70%, rgba(19,136,8,0.15), transparent 40%),
                        #0f0f1a;
            overflow-y: auto;
        }
        #confetti-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 0;
        }
        .app-container {
            position: relative;
            z-index: 1;
            max-width: 460px;
            width: 100%;
            background: rgba(255,255,255,0.12);
            backdrop-filter: blur(20px);
            border-radius: 40px;
            border: 1px solid rgba(255,255,255,0.25);
            box-shadow: 0 30px 60px rgba(0,0,0,0.6);
            margin-bottom: 20px;
            padding-bottom: 10px;
        }
        .tricolor-strip {
            height: 8px;
            background: linear-gradient(to right, #FF9933 33.33%, #FFFFFF 33.33%, #FFFFFF 66.66%, #138808 66.66%);
        }
        .header {
            background: rgba(0,0,80,0.85);
            padding: 20px 15px 15px;
            text-align: center;
            border-bottom: 2px solid rgba(255,215,0,0.3);
        }
        .ashoka-chakra {
            width: 60px; height: 60px;
            margin: 0 auto 10px;
            background: rgba(0,0,80,0.9);
            border-radius: 50%;
            border: 4px solid #FF9933;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            color: #FF9933;
            animation: spin 12s linear infinite;
            box-shadow: 0 0 30px rgba(255,153,51,0.3);
        }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        .header h1 {
            font-family: 'Playfair Display', serif;
            font-weight: 900;
            font-size: 24px;
            background: linear-gradient(135deg, #FF9933, #FFD700, #FF9933);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shimmer 3s ease-in-out infinite;
        }
        @keyframes shimmer { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        .header p {
            color: rgba(255,255,255,0.8);
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 3px;
        }
        .image-container {
            position: relative;
            width: 100%;
            height: 320px;
            background: #0a0a1a;
            overflow: hidden;
            border-bottom: 2px solid rgba(255,215,0,0.2);
        }
        .slide {
            position: absolute;
            width: 100%; height: 100%;
            opacity: 0;
            transition: opacity 0.8s cubic-bezier(0.4,0,0.2,1);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .slide.active { opacity: 1; z-index: 2; }
        .slide img {
            width: 100%; height: 100%;
            object-fit: cover;
            filter: brightness(0.9) contrast(1.05);
        }
        .slide .caption {
            position: absolute;
            bottom: 0;
            left: 0; right: 0;
            background: linear-gradient(transparent, rgba(0,0,20,0.95));
            color: #FFD700;
            padding: 18px 15px 12px;
            font-size: 15px;
            font-weight: 700;
            text-align: center;
            font-family: 'Playfair Display', serif;
            backdrop-filter: blur(4px);
        }
        .nav-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 20px;
            background: rgba(0,0,80,0.7);
            backdrop-filter: blur(10px);
        }
        .nav-btn {
            background: rgba(255,153,51,0.2);
            border: 1px solid rgba(255,153,51,0.4);
            color: #FFD700;
            width: 44px; height: 44px;
            border-radius: 50%;
            font-size: 20px;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 700;
        }
        .nav-btn:hover {
            background: #FF9933;
            color: #000;
            transform: scale(1.05);
        }
        .slide-counter {
            color: #FFD700;
            font-size: 16px;
            font-weight: 700;
            background: rgba(0,0,0,0.3);
            padding: 6px 18px;
            border-radius: 50px;
            border: 1px solid rgba(255,215,0,0.2);
        }
        .action-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            padding: 14px 18px;
            background: rgba(255,255,255,0.05);
        }
        .speak-btn {
            background: linear-gradient(135deg, #FF9933, #FF7700);
            color: #fff;
            border: none;
            padding: 14px;
            border-radius: 60px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(255,153,51,0.3);
        }
        .speak-btn:active { transform: scale(0.95); }
        .read-btn {
            background: rgba(255,255,255,0.12);
            color: #FFD700;
            border: 1px solid #FFD700;
            padding: 14px;
            border-radius: 60px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(4px);
        }
        .read-btn:active { transform: scale(0.95); }
        .read-btn:hover { background: rgba(255,215,0,0.2); }
        .stop-btn {
            background: linear-gradient(135deg, #DC3545, #A71D2A);
            color: #fff;
            border: none;
            padding: 14px;
            border-radius: 60px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            display: none;
            grid-column: span 2;
            box-shadow: 0 4px 15px rgba(220,53,69,0.3);
        }
        .stop-btn.show { display: block; }
        .stop-btn:active { transform: scale(0.95); }

        /* --- Info Box with Close Button --- */
        .info-box {
            position: relative;
            background: rgba(0,0,30,0.7);
            backdrop-filter: blur(15px);
            margin: 12px 12px 16px;
            padding: 18px 40px 16px 18px;
            border-radius: 20px;
            border-left: 6px solid #FF9933;
            display: none;
            border: 1px solid rgba(255,215,0,0.15);
            transition: all 0.3s ease;
        }
        .info-box.show { display: block; animation: slideIn 0.4s cubic-bezier(0.4,0,0.2,1); }
        @keyframes slideIn { from { opacity:0; transform:translateY(15px) scale(0.96); } to { opacity:1; transform:translateY(0) scale(1); } }
        .info-box h3 {
            color: #FFD700;
            font-family: 'Playfair Display', serif;
            font-size: 18px;
            margin-bottom: 6px;
            padding-right: 10px;
        }
        .info-box p {
            color: #d0d0d0;
            line-height: 1.6;
            font-size: 13px;
            font-weight: 400;
            padding-right: 5px;
        }
        .close-btn {
            position: absolute;
            top: 12px;
            right: 16px;
            color: #aaa;
            font-size: 22px;
            font-weight: 300;
            cursor: pointer;
            transition: all 0.2s ease;
            line-height: 1;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: rgba(255,255,255,0.05);
        }
        .close-btn:hover {
            color: #FFD700;
            background: rgba(255,215,0,0.15);
            transform: rotate(90deg);
        }

        .status-bar {
            background: rgba(0,0,80,0.9);
            color: #FFD700;
            text-align: center;
            padding: 10px;
            font-size: 14px;
            font-weight: 600;
            display: none;
            border-top: 1px solid rgba(255,215,0,0.2);
        }
        .status-bar.show { display: block; animation: fadeIn 0.3s; }
        @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
        .footer-jai {
            text-align: center;
            padding: 12px 0 6px;
            color: rgba(255,255,255,0.3);
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 4px;
        }
        .footer-jai span {
            color: #FFD700;
            background: linear-gradient(135deg, #FF9933, #138808);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        @media (max-width:480px){
            .header h1 { font-size: 20px; }
            .image-container { height: 250px; }
            .info-box { padding: 15px 35px 14px 14px; }
            .close-btn { top: 10px; right: 12px; font-size: 20px; }
        }
    </style>
</head>
<body>
    <canvas id="confetti-canvas"></canvas>
    <div class="app-container">
        <div class="tricolor-strip"></div>
        <div class="header">
            <div class="ashoka-chakra">☸</div>
            <h1>🇮🇳 INDEPENDENCE DAY 🇮🇳</h1>
            <p>15th August 1947</p>
        </div>
        <div class="image-container" id="imageContainer"></div>
        <div class="nav-controls">
            <button class="nav-btn" onclick="prevSlide()">◀</button>
            <span class="slide-counter"><span id="currentNum">1</span> / <span id="totalNum">6</span></span>
            <button class="nav-btn" onclick="nextSlide()">▶</button>
        </div>
        <div class="action-buttons">
            <button class="speak-btn" id="speakBtn" onclick="startNarration()">🔊 Hear Story</button>
            <button class="read-btn" onclick="showTextOnly()">📖 Read Text</button>
            <button class="stop-btn" id="stopBtn" onclick="stopNarration()">✋ Stop</button>
        </div>
        <div class="status-bar" id="statusBar"></div>
        <div class="info-box" id="infoBox">
            <span class="close-btn" onclick="hideInfo()">✕</span>
            <h3 id="infoTitle"></h3>
            <p id="infoText"></p>
        </div>
        <div class="footer-jai">🇮🇳 <span>Jai Hind</span> 🇮🇳</div>
    </div>

    <script>
        // --- Image Proxy ---
        const IMAGE_PROXY = 'https://images.weserv.nl/?url=';
        const slides = [
            {
                image: IMAGE_PROXY + encodeURIComponent('https://drive.google.com/uc?export=view&id=1-h2XVtktRs9SoLeDaj_lEC4hxvdXYtVD'),
                caption: "Nehru Hoists the Flag at Red Fort",
                title: "The First Flag Hoisting",
                info: "This iconic photograph captures the exact moment when India's first Prime Minister, Pandit Jawaharlal Nehru, hoisted the national flag at the Red Fort in Delhi. It was 8:30 AM on August 15, 1947. Over 20,000 people gathered to witness this historic moment.",
                narration: "On August 15, 1947, at exactly 8:30 in the morning, India's first Prime Minister Jawaharlal Nehru hoisted the Indian national flag at the historic Red Fort in Delhi. Over twenty thousand Indians gathered to witness this moment as their nation finally became free after nearly two hundred years of British colonial rule."
            },
            {
                image: IMAGE_PROXY + encodeURIComponent('https://drive.google.com/uc?export=view&id=1e8eis2f3N-S9E-x5qyE3i6NvZMpQeXCF'),
                caption: "Tryst with Destiny Speech",
                title: "The Famous Midnight Speech",
                info: "At the stroke of midnight on August 14-15, 1947, Jawaharlal Nehru addressed the Constituent Assembly. His words 'At the stroke of the midnight hour, when the world sleeps, India will awake to life and freedom' became one of the most quoted speeches in world history.",
                narration: "At the stroke of midnight, Jawaharlal Nehru rose to address the Constituent Assembly. His words echoed through history: At the stroke of the midnight hour, when the world sleeps, India will awake to life and freedom."
            },
            {
                image: IMAGE_PROXY + encodeURIComponent('https://drive.google.com/uc?export=view&id=1-IFgykeDWnZc_qnTbJPkapjAbkbuo8cR'),
                caption: "Lord Mountbatten's Last Speech",
                title: "Transfer of Power Ceremony",
                info: "Lord Louis Mountbatten, the last Viceroy of British India, addressed the crowd during the Independence Day ceremony. The British flag was lowered for the last time on Indian soil, marking the official end of the British Empire in India.",
                narration: "Lord Louis Mountbatten, the last Viceroy of British India, addressed the crowd as power was officially transferred. The Union Jack was lowered for the final time, and the Indian tricolor took its place."
            },
            {
                image: IMAGE_PROXY + encodeURIComponent('https://drive.google.com/uc?export=view&id=1xoA2DEW8OsA8X6Oi8aTPMQC94DLDwfU6'),
                caption: "Mahatma Gandhi During Independence",
                title: "The Father of the Nation",
                info: "While celebrations erupted across India, Mahatma Gandhi spent Independence Day in Calcutta fasting and praying for peace. He was deeply troubled by the communal violence during Partition. The man whose non-violent resistance led India to freedom chose prayer over celebration.",
                narration: "While millions celebrated across India, Mahatma Gandhi spent August 15, 1947, in Calcutta, fasting and praying for peace. The Father of the Nation was heartbroken by the violence of Partition and chose prayer rather than celebration."
            },
            {
                image: IMAGE_PROXY + encodeURIComponent('https://drive.google.com/uc?export=view&id=1zTNmvDCYCIFwuJlAT92BiWmyjJ54ai7M'),
                caption: "The Partition of India - 1947",
                title: "A Nation Divided",
                info: "Independence came at a heavy price. The Partition of India created two dominions: India and Pakistan. Over 15 million people were displaced in one of the largest mass migrations in human history.",
                narration: "Independence came with the painful Partition of India. The subcontinent was divided into two nations. Over fifteen million people were displaced in what became one of the largest mass migrations in human history."
            },
            {
                image: IMAGE_PROXY + encodeURIComponent('https://drive.google.com/uc?export=view&id=18uXA6T9sP9rHc6vUTCnHxIiIBioYDOZn'),
                caption: "Indian Constitution Comes into Force",
                title: "The Constitution - January 26, 1950",
                info: "India's Constitution came into effect on January 26, 1950. Dr. B.R. Ambedkar chaired the drafting committee that created the world's longest written constitution. The original was handwritten!",
                narration: "On January 26, 1950, India's Constitution came into effect, making the nation a sovereign democratic republic. Dr. B.R. Ambedkar was the principal architect of this remarkable document."
            }
        ];

        let currentIndex = 0;
        let isNarrating = false;
        let synth = window.speechSynthesis;
        let utterance = null;

        // --- Gallery functions ---
        function initGallery() {
            const container = document.getElementById('imageContainer');
            container.innerHTML = '';
            slides.forEach((s, i) => {
                const div = document.createElement('div');
                div.className = `slide ${i===0?'active':''}`;
                div.innerHTML = `<img src="${s.image}" alt="${s.caption}" loading="lazy"><div class="caption">${s.caption}</div>`;
                container.appendChild(div);
            });
            document.getElementById('totalNum').textContent = slides.length;
            updateCounter();
        }
        function nextSlide() {
            stopNarration();
            hideInfo();
            const els = document.querySelectorAll('.slide');
            els[currentIndex].classList.remove('active');
            currentIndex = (currentIndex + 1) % els.length;
            els[currentIndex].classList.add('active');
            updateCounter();
        }
        function prevSlide() {
            stopNarration();
            hideInfo();
            const els = document.querySelectorAll('.slide');
            els[currentIndex].classList.remove('active');
            currentIndex = (currentIndex - 1 + els.length) % els.length;
            els[currentIndex].classList.add('active');
            updateCounter();
        }
        function updateCounter() {
            document.getElementById('currentNum').textContent = currentIndex + 1;
        }

        // --- 🆕 TOGGLE: Read Text Only (Click again to close) ---
        function showTextOnly() {
            // If the info box is already showing, just hide it and reset
            if (document.getElementById('infoBox').classList.contains('show')) {
                stopNarration(); // Stop any audio just in case
                hideInfo();
                updateNarrationUI(false);
                hideStatus();
                return;
            }
            // Otherwise, stop any audio and show the text
            stopNarration();
            const s = slides[currentIndex];
            showInfo(s.title, s.info);
            updateNarrationUI(false); // Ensure "Stop" button is hidden
            hideStatus();
        }

        // --- 🆕 TOGGLE: Hear Story (Click again to close) ---
        function startNarration() {
            // If the info box is already showing, hide it and stop everything
            if (document.getElementById('infoBox').classList.contains('show')) {
                stopNarration();
                hideInfo();
                updateNarrationUI(false);
                hideStatus();
                return;
            }

            // Proceed with normal narration
            const s = slides[currentIndex];
            showInfo(s.title, s.info);
            
            if (window.AppInventor && typeof window.AppInventor.getWebViewString === 'function') {
                window.AppInventor.getWebViewString("SPEAK:" + s.narration);
                updateNarrationUI(true);
                showStatus('🔊 Narrating...');
            } else {
                if ('speechSynthesis' in window) {
                    stopNarration();
                    utterance = new SpeechSynthesisUtterance(s.narration);
                    utterance.rate = 0.85;
                    utterance.onstart = () => {
                        isNarrating = true;
                        updateNarrationUI(true);
                        showStatus('🔊 Narrating...');
                    };
                    utterance.onend = () => {
                        isNarrating = false;
                        updateNarrationUI(false);
                        hideStatus();
                    };
                    synth.speak(utterance);
                } else {
                    alert('Speech not supported in this browser.');
                }
            }
        }

        function stopNarration() {
            if (window.AppInventor && typeof window.AppInventor.getWebViewString === 'function') {
                window.AppInventor.getWebViewString("STOP");
            }
            if (synth) synth.cancel();
            isNarrating = false;
            updateNarrationUI(false);
            hideStatus();
        }

        function appInventorEvent(eventType) {
            if (eventType === 'started') {
                isNarrating = true;
                updateNarrationUI(true);
                showStatus('🔊 Narrating...');
            } else {
                isNarrating = false;
                updateNarrationUI(false);
                hideStatus();
            }
        }

        function updateNarrationUI(active) {
            const speakBtn = document.getElementById('speakBtn');
            const stopBtn = document.getElementById('stopBtn');
            if (active) {
                speakBtn.style.display = 'none';
                stopBtn.classList.add('show');
            } else {
                speakBtn.style.display = 'block';
                stopBtn.classList.remove('show');
            }
        }

        // --- UI helpers ---
        function showInfo(title, text) {
            document.getElementById('infoTitle').textContent = title;
            document.getElementById('infoText').textContent = text;
            document.getElementById('infoBox').classList.add('show');
        }
        function hideInfo() {
            document.getElementById('infoBox').classList.remove('show');
        }
        function showStatus(msg) {
            const bar = document.getElementById('statusBar');
            bar.textContent = msg;
            bar.classList.add('show');
        }
        function hideStatus() {
            document.getElementById('statusBar').classList.remove('show');
        }

        // --- Confetti ---
        function startConfetti() {
            const canvas = document.getElementById('confetti-canvas');
            const ctx = canvas.getContext('2d');
            let width = window.innerWidth, height = window.innerHeight;
            canvas.width = width; canvas.height = height;
            const colors = ['#FF9933','#FFFFFF','#138808'];
            const pieces = [];
            for (let i=0; i<120; i++) {
                pieces.push({
                    x: Math.random()*width, y: Math.random()*height - height,
                    w: Math.random()*8+4, h: Math.random()*6+3,
                    color: colors[Math.floor(Math.random()*3)],
                    speed: Math.random()*2+0.5,
                    angle: Math.random()*360,
                    spin: (Math.random()-0.5)*4
                });
            }
            function draw() {
                ctx.clearRect(0,0,width,height);
                for (let p of pieces) {
                    p.y += p.speed;
                    p.angle += p.spin;
                    if (p.y > height+20) { p.y = -20; p.x = Math.random()*width; p.color = colors[Math.floor(Math.random()*3)]; }
                    ctx.save();
                    ctx.translate(p.x, p.y);
                    ctx.rotate((p.angle*Math.PI)/180);
                    ctx.fillStyle = p.color;
                    ctx.shadowColor = p.color;
                    ctx.shadowBlur = 12;
                    ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h);
                    ctx.restore();
                }
                requestAnimationFrame(draw);
            }
            draw();
            window.addEventListener('resize', ()=>{ width=window.innerWidth; height=window.innerHeight; canvas.width=width; canvas.height=height; });
        }

        window.onload = () => {
            initGallery();
            startConfetti();
            if (speechSynthesis) speechSynthesis.getVoices();
        };
    </script>
</body>
</html>
